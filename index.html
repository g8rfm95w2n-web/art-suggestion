<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modèles à copier</title>
  <meta name="description" content="Trouver des peintures et dessins du domaine public à copier pour s'entraîner.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
  <!-- ?v=… : à changer après une modification du CSS, pour forcer les navigateurs
       à télécharger la nouvelle version au lieu de leur copie en cache. -->
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">Modèles à copier</a>
    <span class="tagline">Peintures et dessins du domaine public</span>
    <nav class="topnav">
      <a href="#/" id="nav-search">Recherche</a>
      <a href="#/tableau" id="nav-board">Mon tableau <span id="board-count" class="tab-count">0</span></a>
    </nav>
  </header>

  <!-- Recherche par envie : texte libre traduit en filtres (js/envies.js) -->
  <form id="envie" class="envie" role="search">
    <input id="envie-text" type="search" enterkeyhint="search" autocomplete="off"
           aria-label="Ce dont j'ai envie"
           placeholder="J'ai envie de… (ex. : quelque chose de paisible avec de l'eau)">
    <button type="submit" class="btn btn-accent">Chercher</button>
  </form>

  <!-- Les options des listes sont remplies par app.js à partir de filters.js -->
  <form id="filters" class="filters" aria-label="Filtres de recherche">
    <label>Thème
      <select name="theme"><option value="">Tous les thèmes</option></select>
    </label>
    <label>Époque
      <select name="epoque"><option value="">Toutes les époques</option></select>
    </label>
    <label>Support
      <select name="support"><option value="">Peinture et dessin</option></select>
    </label>
    <label>Difficulté
      <select name="difficulte"><option value="">Toutes</option></select>
    </label>
    <button type="button" id="surprise" class="btn btn-accent">🎲 Surprends-moi</button>
  </form>

  <main id="view" aria-live="polite"></main>

  <footer class="footer">
    Images et données (domaine public) :
    <a href="https://www.metmuseum.org/" target="_blank" rel="noopener">The Met</a>,
    <a href="https://www.artic.edu/" target="_blank" rel="noopener">Art Institute of Chicago</a>,
    <a href="https://www.clevelandart.org/" target="_blank" rel="noopener">Cleveland Museum of Art</a>
    et <a href="https://open.smk.dk/" target="_blank" rel="noopener">SMK</a>.
  </footer>

  <!-- type="module" : active import/export entre fichiers JS -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
